<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Anime Impact 3D+</title>
<style>
body { margin:0; overflow:hidden; }
#ui {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
}
button { padding:8px; margin-top:5px; }
</style>
</head>
<body>

<div id="ui">
  HP: <span id="hp">100</span><br>
  <button onclick="elementSkill('pyro')">🔥 Pyro</button>
  <button onclick="elementSkill('cryo')">❄ Cryo</button>
  <button onclick="elementSkill('electro')">⚡ Electro</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 20, 80);

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,5,10);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

let controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.maxDistance = 15;
controls.minDistance = 5;

// Lighting
let sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10,20,10);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// Ground (stylized)
let groundGeo = new THREE.PlaneGeometry(200,200,50,50);
let groundMat = new THREE.MeshToonMaterial({color:0x3cb043});
let ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Random hills
for(let i=0;i<groundGeo.vertices?.length;i++){
  groundGeo.vertices[i].z = Math.random()*2;
}

// Player (anime proportion)
let player = new THREE.Group();

let body = new THREE.Mesh(
  new THREE.CylinderGeometry(0.5,0.6,2,32),
  new THREE.MeshToonMaterial({color:0xff99cc})
);

let head = new THREE.Mesh(
  new THREE.SphereGeometry(0.9,32,32),
  new THREE.MeshToonMaterial({color:0xffe0bd})
);
head.position.y = 1.6;

player.add(body);
player.add(head);
player.position.y = 1;
scene.add(player);

// Slime (transparent cute)
let slime = new THREE.Mesh(
  new THREE.SphereGeometry(1,32,32),
  new THREE.MeshToonMaterial({
    color:0x00ff88,
    transparent:true,
    opacity:0.8
  })
);
slime.position.set(5,1,0);
scene.add(slime);

let hp = 100;
let slimeHP = 100;

let keys = {};
document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function elementSkill(type){
  let distance = player.position.distanceTo(slime.position);
  if(distance<4){
    let color = 0xff0000;
    let damage = 20;

    if(type==="cryo"){ color=0x99ccff; damage=15; }
    if(type==="electro"){ color=0xcc66ff; damage=25; }

    slime.material.color.set(color);
    slimeHP -= damage;

    createParticles(color);

    setTimeout(()=>slime.material.color.set(0x00ff88),300);

    if(slimeHP<=0){
      alert("✨ Slime Defeated!");
      slime.position.set(Math.random()*10,1,Math.random()*10);
      slimeHP=100;
    }
  }
}

function createParticles(color){
  let geo = new THREE.SphereGeometry(0.1,8,8);
  let mat = new THREE.MeshBasicMaterial({color:color});
  let particle = new THREE.Mesh(geo,mat);
  particle.position.copy(slime.position);
  scene.add(particle);

  let interval = setInterval(()=>{
    particle.scale.multiplyScalar(1.1);
    particle.material.opacity -=0.05;
    if(particle.material.opacity<=0){
      clearInterval(interval);
      scene.remove(particle);
    }
  },30);
}

function animate(){
  requestAnimationFrame(animate);

  let speed = keys["shift"]?0.2:0.1;

  if(keys["w"]) player.position.z-=speed;
  if(keys["s"]) player.position.z+=speed;
  if(keys["a"]) player.position.x-=speed;
  if(keys["d"]) player.position.x+=speed;

  let dist = player.position.distanceTo(slime.position);
  if(dist<2){
    hp -=0.2;
    document.getElementById("hp").innerText=Math.floor(hp);
    if(hp<=0){
      alert("💀 You Died!");
      hp=100;
      player.position.set(0,1,0);
    }
  }

  controls.target.copy(player.position);
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
